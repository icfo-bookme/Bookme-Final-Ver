name: Deploy BookMe

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2️⃣ Deploy via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "✅ Setting Git safe directory..."
            git config --global --add safe.directory /var/www/bookme

            echo "✅ Fixing permissions..."
            sudo chown -R deploy:deploy /var/www/bookme
            sudo chmod -R 755 /var/www/bookme

            echo "✅ Pull latest code..."
            cd /var/www/bookme
            git reset --hard
            git pull origin main

            echo "✅ Install dependencies..."
            npm install

            echo "✅ Build project..." 
            if ! npm run build; then
              echo "❌ Build failed, aborting deploy."
              exit 1
            fi

            echo "✅ Build successful. Reloading PM2..."
            # Start PM2 if not already running
            pm2 describe bookme || pm2 start ecosystem.config.js

            # Reload with updated env
            pm2 reload ecosystem.config.js --update-env

            echo "✅ Deployment completed f successfully!"