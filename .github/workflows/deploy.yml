name: Deploy BookMe

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2️⃣ Deploy via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /var/www/bookme

            echo "📥 Syncing with remote repo..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "📦 Installing dependencies..."
            npm install

            echo "🏗️ Building project..."
            npm run build

            echo "♻️ Restarting PM2 safely..."
            pm2 restart ecosystem.config.js --name bookme || pm2 start ecosystem.config.js --name bookme

            echo "💾 Saving PM2 state..."
            pm2 save

            echo "✅ Deployment successful!"