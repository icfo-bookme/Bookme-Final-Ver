name: Deploy BookMe

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2️⃣ Deploy via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /var/www/bookme

            echo "📥 Pull latest code..."
            git reset --hard
            git pull origin main

            echo "📦 Install dependencies..."
            npm install

            echo "🏗️ Build project..."
            npm run build

            echo "♻️ Restart PM2 safely..."
            pm2 delete bookme || true
            pm2 start ecosystem.config.js --name bookme

            echo "💾 Save PM2 state..."
            pm2 save

            echo "✅ Deployment successful!"